<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>SpendWise</h1>
        <p>Smart budgeting made simple.</p>

        <form id="budgetForm">
            <label for="budget">Monthly Budget:</label>
            <input type="number" id="budget" min="0" step="0.01" required>

            <h2>Expenses</h2>

            <label for="food">Food:</label>
            <input type="number" id="food" min="0" step="0.01" required>

            <label for="transport">Transport:</label>
            <input type="number" id="transport" min="0" step="0.01" required>

            <label for="entertainment">Entertainment:</label>
            <input type="number" id="entertainment" min="0" step="0.01" required>

            <button type="submit">Calculate Budget</button>
        </form>

        <div id="results">
            <h2>Budget Summary</h2>

            <p id="budgetResult"></p>
            <p id="expensesResult"></p>
            <p id="balanceResult"></p>
            <p id="statusResult"></p>

            <h3>Expense Records</h3>
            <ul id="expenseList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
